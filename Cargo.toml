[package]
name = "bar-anchor"
description = "Open a panel from the bar icon that was clicked: compositor anchoring and placement"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/NathanielInman/bar-anchor"
authors = ["Nathaniel Inman"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
