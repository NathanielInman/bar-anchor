name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"
  pull_request:
    # Docs, pictures and notes never change a build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Pictures/**"
      - "artwork/**"
      - "LICENSE"
      - "AGENTS.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
